<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Bin Dashboard</title>
    <link rel="stylesheet" href="../static/css/trashbin_style.css">
</head>
<header>
        <nav class="navbar">
            <ul>
                <li><a href="../index.html">Home</a></li>
                <li><a href="meteo.html">Weather</a></li>
                <li><a href="experience.html">Experience</a></li>
                <li><a href="trashbin.html">Trashbinproject</a></li>
                <li><a href="TransportGame.html">Game</a></li>
            </ul>
        </nav>
</header>
<body>
    
    <h1>🗑️ Smart Bin Control Panel 🗑️</h1>
    <div class="colonna">
        <div id="status-badge" class="online">STATUS ONLINE</div>
        <div class="video-box">
            <img id="live-streem" src="https://sox-ashley-powder-coral.trycloudflare.com" onerror="this.src='https://sox-ashley-powder-coral.trycloudflare.com/video_feed?' + new Date().getTime();" style="display: none;" alt="Live Stream">
            <div id="offline-screen">
                <div class="overlay-content">
                    <p>⚠️ CAMERA OFFLINE ⚠️</p>
                    <p>Trashbin is not connected</p>
                </div>
            </div>
        </div>
    </div>

    <div class="container">
        <div class="card">
            <h2>Plastic</h2>
            <div id="count-plastica" class="count">0</div>
        </div>
        <div class="card">
            <h2>Paper</h2>
            <div id="count-carta" class="count">0</div>
        </div>
    </div>

    <div class="controls">
        <h3>Manual Controls</h3>
        <button class="btn btn-plastica " onclick="apriBin('plastica')">Open Plastic</button>
        <button class="btn btn-carta "onclick="apriBin('carta')">Open Paper</button>
    </div>

    <script src="../static/js/script.js"></script>
</body>
</html>
