<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trash Conveyor - Prototype 1 (SVG)</title>
    <style>
        /* =========================================
           STILE GENERALE
           ========================================= */
        body {
            font-family: 'Courier New', Courier, monospace;
            background-color: #1a252f;
            color: #ecf0f1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
        }

        h1 { color: #f1c40f; text-transform: uppercase; margin-bottom: 5px; }
        p { color: #bdc3c7; margin-bottom: 30px; }

        /* =========================================
           LA GRIGLIA DI GIOCO
           ========================================= */
        #gioco-container {
            background-color: #2c3e50;
            padding: 10px;
            border-radius: 8px;
            border: 4px solid #7f8c8d;
            box-shadow: 0 15px 30px rgba(0,0,0,0.6);
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 5px;
        }

        /* =========================================
           I BLOCCHI (TILES)
           ========================================= */
        .tile {
            width: 100px;
            height: 100px;
            background-color: #34495e; /* Colore del pavimento */
            border-radius: 4px;
            cursor: pointer;
            transition: transform 0.3s cubic-bezier(0.4, 0.0, 0.2, 1); /* Rotazione più elastica */
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .tile:hover {
            background-color: #3b536b;
            box-shadow: inset 0 0 10px rgba(241, 196, 15, 0.3); /* Luce gialla al passaggio del mouse */
        }

        /* =========================================
           SVG E ANIMAZIONE DEL MOVIMENTO
           ========================================= */
        .nastro-svg {
            width: 100%;
            height: 100%;
            display: block;
        }

        /* Questo è il trucco magico: anima il tratteggio della linea! */
        @keyframes scorriNastro {
            to { stroke-dashoffset: -30; } 
        }

        .animato {
            animation: scorriNastro 0.8s linear infinite;
        }

        /* =========================================
           START & END
           ========================================= */
        .start, .end {
            color: white;
            font-weight: bold;
            font-size: 14px;
            cursor: default; /* Non cliccabile */
        }
        .start { background-color: #27ae60; border: 2px solid #2ecc71;}
        .end { background-color: #e67e22; border: 2px solid #f39c12;}
        .start:hover, .end:hover { background-color: inherit; box-shadow: none; }

    </style>
</head>
<body>

    <h1>Riciclo in tilt!</h1>
    <p>Clicca sui nastri per ruotarli e creare un percorso continuo.</p>

    <div id="gioco-container">
        <div class="tile start">SPAZZATURA</div>

        <div class="tile" data-angle="0" onclick="ruotaTubo(this)">
            <svg viewBox="0 0 100 100" class="nastro-svg">
                <path d="M 50 0 A 50 50 0 0 0 100 50" fill="none" stroke="#222" stroke-width="24" />
                <path d="M 50 0 A 50 50 0 0 0 100 50" fill="none" stroke="#f1c40f" stroke-width="20" stroke-dasharray="15 15" class="animato" />
            </svg>
        </div>

        <div class="tile" data-angle="0" onclick="ruotaTubo(this)">
            <svg viewBox="0 0 100 100" class="nastro-svg">
                <line x1="0" y1="50" x2="100" y2="50" stroke="#222" stroke-width="24" />
                <line x1="0" y1="50" x2="100" y2="50" stroke="#f1c40f" stroke-width="20" stroke-dasharray="15 15" class="animato" />
            </svg>
        </div>

        <div class="tile" data-angle="90" style="transform: rotate(90deg);" onclick="ruotaTubo(this)">
            <svg viewBox="0 0 100 100" class="nastro-svg">
                <line x1="0" y1="50" x2="100" y2="50" stroke="#222" stroke-width="24" />
                <line x1="0" y1="50" x2="100" y2="50" stroke="#f1c40f" stroke-width="20" stroke-dasharray="15 15" class="animato" />
            </svg>
        </div>

        <div class="tile" data-angle="90" style="transform: rotate(90deg);" onclick="ruotaTubo(this)">
            <svg viewBox="0 0 100 100" class="nastro-svg">
                <path d="M 50 0 A 50 50 0 0 0 100 50" fill="none" stroke="#222" stroke-width="24" />
                <path d="M 50 0 A 50 50 0 0 0 100 50" fill="none" stroke="#f1c40f" stroke-width="20" stroke-dasharray="15 15" class="animato" />
            </svg>
        </div>

        <div class="tile" data-angle="180" style="transform: rotate(180deg);" onclick="ruotaTubo(this)">
            <svg viewBox="0 0 100 100" class="nastro-svg">
                <path d="M 50 0 A 50 50 0 0 0 100 50" fill="none" stroke="#222" stroke-width="24" />
                <path d="M 50 0 A 50 50 0 0 0 100 50" fill="none" stroke="#f1c40f" stroke-width="20" stroke-dasharray="15 15" class="animato" />
            </svg>
        </div>

        <div class="tile" data-angle="0" onclick="ruotaTubo(this)">
            <svg viewBox="0 0 100 100" class="nastro-svg">
                <line x1="0" y1="50" x2="100" y2="50" stroke="#222" stroke-width="24" />
                <line x1="0" y1="50" x2="100" y2="50" stroke="#f1c40f" stroke-width="20" stroke-dasharray="15 15" class="animato" />
            </svg>
        </div>

        <div class="tile" data-angle="270" style="transform: rotate(270deg);" onclick="ruotaTubo(this)">
            <svg viewBox="0 0 100 100" class="nastro-svg">
                <path d="M 50 0 A 50 50 0 0 0 100 50" fill="none" stroke="#222" stroke-width="24" />
                <path d="M 50 0 A 50 50 0 0 0 100 50" fill="none" stroke="#f1c40f" stroke-width="20" stroke-dasharray="15 15" class="animato" />
            </svg>
        </div>

        <div class="tile end">BIDONE</div>
    </div>

    <script>
        function ruotaTubo(elemento) {
            let angoloAttuale = parseInt(elemento.getAttribute('data-angle'));
            let nuovoAngolo = angoloAttuale + 90;
            
            elemento.style.transform = `rotate(${nuovoAngolo}deg)`;
            elemento.setAttribute('data-angle', nuovoAngolo);
        }
    </script>
</body>
</html>
